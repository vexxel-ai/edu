<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/static/js/visualizations/base-visualization.js"></script>
    <script src="/static/js/visualizations/mlp-forward.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-3xl font-bold mb-4">MLP Visualization Test</h1>
    <div id="test-container" style="width: 100%; height: 600px; background: #1f2937; border-radius: 8px;">
        <!-- Visualization will appear here -->
    </div>

    <script>
        console.log('=== STARTING TEST ===');
        console.log('D3 loaded:', typeof d3 !== 'undefined');
        console.log('BaseVisualization loaded:', typeof BaseVisualization !== 'undefined');
        console.log('MLPForwardVisualization loaded:', typeof MLPForwardVisualization !== 'undefined');

        // Wait for everything to load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing visualization...');

            try {
                const viz = new MLPForwardVisualization('test-container', {
                    layers: [3, 4, 2],
                    activation: 'relu',
                    inputData: [0.5, 0.8, 0.3],
                    speed: 1000
                });

                console.log('Visualization object created:', viz);
                viz.init();
                console.log('Visualization initialized successfully!');

                // Auto-play after 1 second
                setTimeout(() => {
                    console.log('Auto-playing...');
                    viz.play();
                }, 1000);

            } catch (error) {
                console.error('ERROR:', error);
                console.error('Stack:', error.stack);
                document.getElementById('test-container').innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ef4444;">
                        <h2 style="font-size: 24px; margin-bottom: 16px;">Error</h2>
                        <p>${error.message}</p>
                        <pre style="margin-top: 16px; text-align: left; background: #000; padding: 16px; border-radius: 4px; overflow: auto;">${error.stack}</pre>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
