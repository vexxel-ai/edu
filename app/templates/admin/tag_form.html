<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if tag %}Edit{% else %}New{% endif %} Tag - edu.vexxel.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">
                {% if tag %}Edit Tag{% else %}New Tag{% endif %}
            </h1>
            <a href="/admin" class="text-blue-600 hover:underline">Back to Dashboard</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="bg-white p-6 rounded-lg shadow">
            <form
                method="POST"
                action="{% if tag %}/admin/tags/{{ tag.id }}/edit{% else %}/admin/tags{% endif %}"
            >
                <!-- Name -->
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        Name *
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ tag.name if tag else '' }}"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Reinforcement Learning"
                    >
                </div>

                <!-- Slug -->
                <div class="mb-4">
                    <label for="slug" class="block text-sm font-medium text-gray-700 mb-2">
                        Slug * (URL-friendly identifier)
                    </label>
                    <input
                        type="text"
                        id="slug"
                        name="slug"
                        value="{{ tag.slug if tag else '' }}"
                        required
                        pattern="[a-z0-9-]+"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., reinforcement-learning"
                    >
                    <p class="text-xs text-gray-500 mt-1">Only lowercase letters, numbers, and hyphens</p>
                </div>

                <!-- Parent Tag -->
                <div class="mb-6">
                    <label for="parent_id" class="block text-sm font-medium text-gray-700 mb-2">
                        Parent Tag (optional)
                    </label>
                    <select
                        id="parent_id"
                        name="parent_id"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="">None (root tag)</option>
                        {% for t in tags %}
                        <option
                            value="{{ t.id }}"
                            {% if tag and tag.parent_id == t.id %}selected{% endif %}
                        >
                            {{ t.name }}
                        </option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">
                        Select a parent tag to create a hierarchy (e.g., "The RL Problem" under "Reinforcement Learning")
                    </p>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4">
                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition"
                    >
                        {% if tag %}Update Tag{% else %}Create Tag{% endif %}
                    </button>
                    <a
                        href="/admin"
                        class="bg-gray-300 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-400 transition"
                    >
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
