{% extends "base.html" %}

{% block title %}Admin Login - edu.vexxel.ai{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-bg-card p-8 rounded-custom shadow-lg border border-border w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-text-primary">Admin Login</h1>

        <form method="POST" action="/admin/login">
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-text-secondary mb-2">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-3 py-2 border border-border rounded-custom bg-bg-primary text-text-primary focus:outline-none focus:ring-2 focus:ring-accent"
                    placeholder="Enter admin password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-accent text-white py-2 px-4 rounded-custom hover:bg-accent-hover transition"
            >
                Login
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/" class="text-sm text-accent hover:underline">
                Back to site
            </a>
        </div>
    </div>
</div>
{% endblock %}
