<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Resource - edu.vexxel.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">
                Add Resource to "{{ post.title }}"
            </h1>
            <a href="/admin/modules/{{ post.id }}/edit" class="text-blue-600 hover:underline">
                Back to Module
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="bg-white p-6 rounded-lg shadow">
            <form
                method="POST"
                action="/admin/modules/{{ post.id }}/resources"
                enctype="multipart/form-data"
            >
                <!-- Resource Type -->
                <div class="mb-4">
                    <label for="resource_type" class="block text-sm font-medium text-gray-700 mb-2">
                        Resource Type *
                    </label>
                    <select
                        id="resource_type"
                        name="resource_type"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        onchange="toggleFields()"
                    >
                        <option value="">Select type...</option>
                        <option value="image">Image (Handwritten Notes)</option>
                        <option value="slide">Google Slides</option>
                        <option value="youtube">YouTube Video</option>
                        <option value="blog_link">Blog/Article Link</option>
                        <option value="html">Custom HTML</option>
                    </select>
                </div>

                <!-- Title -->
                <div class="mb-4">
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                        Title *
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Introduction to RL Video"
                    >
                </div>

                <!-- URL Field (for slides, youtube, blog_link) -->
                <div id="url-field" class="mb-4 hidden">
                    <label for="url" class="block text-sm font-medium text-gray-700 mb-2">
                        URL
                    </label>
                    <input
                        type="url"
                        id="url"
                        name="url"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="https://..."
                    >
                    <p id="url-hint" class="text-xs text-gray-500 mt-1"></p>
                </div>

                <!-- File Upload (for images) -->
                <div id="file-field" class="mb-4 hidden">
                    <label for="file" class="block text-sm font-medium text-gray-700 mb-2">
                        Upload Image
                    </label>
                    <input
                        type="file"
                        id="file"
                        name="file"
                        accept=".jpg,.jpeg,.png,.gif,.webp"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        Supported: JPG, PNG, GIF, WebP (max 10MB)
                    </p>
                </div>

                <!-- Content Field (for HTML) -->
                <div id="content-field" class="mb-4 hidden">
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
                        HTML Content
                    </label>
                    <textarea
                        id="content"
                        name="content"
                        rows="10"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                        placeholder="<div>Your custom HTML here...</div>"
                    ></textarea>
                </div>

                <!-- Order -->
                <div class="mb-6">
                    <label for="order" class="block text-sm font-medium text-gray-700 mb-2">
                        Order (for sorting)
                    </label>
                    <input
                        type="number"
                        id="order"
                        name="order"
                        value="0"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        Lower numbers appear first
                    </p>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4">
                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition"
                    >
                        Add Resource
                    </button>
                    <a
                        href="/admin/modules/{{ post.id }}/edit"
                        class="bg-gray-300 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-400 transition"
                    >
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function toggleFields() {
            const type = document.getElementById('resource_type').value;
            const urlField = document.getElementById('url-field');
            const fileField = document.getElementById('file-field');
            const contentField = document.getElementById('content-field');
            const urlInput = document.getElementById('url');
            const fileInput = document.getElementById('file');
            const contentInput = document.getElementById('content');
            const urlHint = document.getElementById('url-hint');

            // Hide all fields
            urlField.classList.add('hidden');
            fileField.classList.add('hidden');
            contentField.classList.add('hidden');

            // Remove required attributes
            urlInput.removeAttribute('required');
            fileInput.removeAttribute('required');
            contentInput.removeAttribute('required');

            // Show relevant field based on type
            switch(type) {
                case 'slide':
                    urlField.classList.remove('hidden');
                    urlInput.setAttribute('required', 'required');
                    urlHint.textContent = 'Use the embed URL from Google Slides (File > Share > Publish to web > Embed)';
                    urlInput.placeholder = 'https://docs.google.com/presentation/d/e/.../embed?start=false&loop=false&delayms=3000';
                    break;
                case 'youtube':
                    urlField.classList.remove('hidden');
                    urlInput.setAttribute('required', 'required');
                    urlHint.textContent = 'Use the embed URL format: https://www.youtube.com/embed/VIDEO_ID';
                    urlInput.placeholder = 'https://www.youtube.com/embed/VIDEO_ID';
                    break;
                case 'blog_link':
                    urlField.classList.remove('hidden');
                    urlInput.setAttribute('required', 'required');
                    urlHint.textContent = 'Direct URL to the blog post or article';
                    urlInput.placeholder = 'https://blog.example.com/article';
                    break;
                case 'image':
                    fileField.classList.remove('hidden');
                    fileInput.setAttribute('required', 'required');
                    break;
                case 'html':
                    contentField.classList.remove('hidden');
                    contentInput.setAttribute('required', 'required');
                    break;
            }
        }

        // Initialize on page load
        toggleFields();
    </script>
</body>
</html>
