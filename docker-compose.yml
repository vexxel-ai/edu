version: '3.8'

# Main docker-compose file for local development
# Use: docker-compose up

services:
  postgres:
    image: postgres:15-alpine
    container_name: edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: edu_vexxel
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduuser -d edu_vexxel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-app
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://eduuser:${DB_PASSWORD:-devpassword}@postgres:5432/edu_vexxel

      # Supabase (updated to new API key structure)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      # Admin
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@vexxel.ai}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-change-me}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./static:/app/static
    networks:
      - app-network
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
