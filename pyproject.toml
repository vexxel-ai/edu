[project]
name = "edu"
version = "0.1.0"
description = "A multi-user learning platform for sharing engineering notes, slides, and educational content"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Vexxel Team", email = "admin@vexxel.ai" }
]
license = { text = "MIT" }
dependencies = [
    "alembic>=1.17.1",
    "fastapi[standard]>=0.121.1",
    "graphviz>=0.21",
    "markdown>=3.10",
    "matplotlib>=3.10.7",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.27",
    "supabase>=2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",  # For testing FastAPI
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
    "manual: marks tests that require manual intervention (e.g., clicking email links)",
]
# By default, skip integration and manual tests
addopts = "-m 'not integration and not manual' -v"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlmypy"]
